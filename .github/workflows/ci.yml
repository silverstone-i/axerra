name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  arch-check:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run arch:check
      - name: Upload architecture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-report
          path: docs/architecture/
          retention-days: 30

  test-fast:
    name: test-fast
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL_TEST: postgres://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm -w apps/server run test:unit
      - run: npm -w apps/server run test:contract
      - run: npm -w apps/server run test:rbac

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL_TEST: postgres://axe_admin:test@localhost:5432/axerra_test
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_USER: axe_admin
          POSTGRES_PASSWORD: test
          POSTGRES_DB: axerra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axe_admin -d axerra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm -w apps/server run migrate:test
      - run: npm -w apps/server run test:integration
