name: Quarterly gap-analysis review

# Opens a tracking issue on a calendar-quarterly cadence (09:00 UTC on
# the 1st of January, April, July, and October) reminding the maintainer
# to re-run the doc-vs-code gap-analysis. The first quarterly tick after
# merge of this workflow is the calibration baseline; subsequent ticks
# open one issue each.
#
# Manual trigger also available from the Actions tab.

on:
  schedule:
    # 09:00 UTC on the 1st of January, April, July, October.
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  open-tracking-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open quarterly gap-analysis issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          QUARTER="$(date -u +'%Y Q')$(( ( $(date -u +'%-m') - 1 ) / 3 + 1 ))"
          TITLE="Quarterly gap-analysis review — ${QUARTER}"
          BODY=$(cat <<'EOF'
          Time for the quarterly doc-vs-code reconciliation pass.

          Goal: catch drift between PRD / ADRs / rules and the actual codebase
          before it compounds. The canonical artifacts are `docs/PRD.md`
          (intended product state) and `docs/rules/*.md` (per-module
          implementation guardrails); the Phase A / Phase B reconciliation
          (ADR-0027) retired the standalone `docs/gap-analysis.md` and
          `docs/roadmap.md` scaffolding, so drift is detected directly
          against PRD + rules now.

          ## Checklist

          - [ ] Re-run the gap-analysis prompt from `docs/PROMPTS.md` against `docs/PRD.md` and `docs/rules/`; record findings inline in this issue.
          - [ ] Spot-check each `docs/rules/<module>.md` against the corresponding `apps/server/src/modules/<module>/` (and the three system trees: `system/auth/`, `system/core/`, `system/tenants/`) for behavioral drift.
          - [ ] Confirm the doc-coverage CI check is still rejecting untouched-rules PRs by inspecting recent merges.
          - [ ] Confirm `scripts/checkLicenses.js` still passes — any new production deps should be in `.licenses-allowed.json`.
          - [ ] If new drift items appear: open targeted reconciliation PRs that edit PRD + the relevant rules file together.

          ## Anti-patterns

          - Don't recreate a long-lived `docs/gap-analysis.md` — fold findings directly into PRD/rules edits the same way Phase A/B did.
          - Don't defer "needs manual review" items that a grep would resolve.
          EOF
          )
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$BODY" \
            --label "maintenance" || gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$BODY"
